<script type="text/markdown" data-id="introduction" data-title="Introduction" data-file="README.md">
# humanpc

Human-like PC automation framework for Windows. A scriptable layer over mouse,
keyboard, screen, windows, and apps — with a **Human Interaction Layer** (Bézier
mouse paths, Fitts-law velocity, natural typing rhythm, human scrolling) so every
automated action behaves like a person rather than a script.

> **Status:** 🟢 Phases 0–4 complete — the engine and all three interfaces work.
> Phase 5 (polish) remains. See [`docs/BUILD_PHASES.md`](docs/BUILD_PHASES.md).

> **Intended use:** authorized automation only — RPA, QA / UI-test automation,
> accessibility tooling, and personal task automation on machines you control.

## What it does

- **One simple API** — `bot.click("Login")`, `bot.type("hello")`, `bot.find_all(Image("icon.png"))`.
- **Flexible targets** — text, an image, coordinates, or a region all resolve through one engine.
- **Human by default** — natural mouse curves, variable typing speed, pauses, and timing.
- **Three ways to call it** — Python library, CLI, and HTTP / MCP tool server (agent-callable).
- **Do anything on a PC** — input, screenshots/OCR, window & app management, clipboard, shell.

## Install

```bash
pip install -e .            # core (zero dependencies; dry-run + tests work as-is)
pip install -e .[all]       # real input, capture, OCR, UIA, windows
pip install -e .[server]    # FastAPI HTTP + MCP tool server
```

## Usage

**Python**
```python
from humanpc import Bot, Image
bot = Bot()                          # real input (lazy-loads pyautogui)
bot.move_to("Sign in").click()       # text -> UIA/OCR; human mouse path
bot.type("hello@example.com")        # human typing (self-correcting typos)
bot.click(Image("submit.png"))       # image -> OpenCV template match
bot.wait_for("Dashboard", timeout=20)

Bot(dry_run=True).click((400, 300))  # plan + audit, never touches the OS
```

**CLI** (argparse, no extra deps)
```bash
humanpc click "Login"
humanpc --dry-run --json find 400,300
humanpc type "hello world"
humanpc run echo hi
humanpc flow examples/flows/notepad.yaml
```

**HTTP / MCP servers** (agent-callable tools)
```bash
humanpc serve --http --port 8000     # POST /click {"target":"Login"}
humanpc serve --mcp                  # MCP stdio tool server
```

**Declarative flow** (`humanpc flow file.yaml`)
```yaml
persona: careful
steps:
  - open_app: notepad.exe
  - wait_for: "Untitled - Notepad"
  - type: "Hello from humanpc"
  - hotkey: [ctrl, s]
```

A global kill-switch (`Ctrl+Alt+Q`, or throw the cursor into a screen corner)
aborts any run.

## Design docs

- [`docs/BUILD_PHASES.md`](docs/BUILD_PHASES.md) — live build tracker (what's done / in progress).
- [`docs/PLAN.md`](docs/PLAN.md) — implementation plan, architecture, file layout, roadmap.
- [`docs/blueprint/`](docs/blueprint/) — the Human Interaction Layer research blueprint + diagrams.

```

<script type="text/markdown" data-id="flow-language" data-title="Flow Language" data-file="FLOW_LANGUAGE.md">
# humanpc Flow Language Reference

The **flow language** is how you write an automation as a plain **YAML** (or JSON)
file — a list of steps that humanpc runs top to bottom. No Python required.

It's the right tool for **linear scripts**: "open this, wait for that, click here,
type this." When you need randomness, loops, or `if` logic, graduate to the
[Python API](PYTHON_API.md) — same engine, full programming language.

Run a flow:

```bash
humanpc flow myflow.yaml               # run it for real
humanpc --dry-run flow myflow.yaml     # plan + audit, never touches the OS
humanpc --persona careful flow myflow.yaml
```

Or from Python:

```python
from humanpc import FlowRunner
FlowRunner().run_file("myflow.yaml")
```

---

## 1. File structure

A flow is a mapping with an optional `persona` / `dry_run` and a list of `steps`:

```yaml
persona: careful        # default | fast | careful | tired   (optional)
dry_run: false          # optional; --dry-run on the CLI overrides this
steps:
  - open_app: notepad.exe
  - wait_for: "Untitled - Notepad"
  - type: "Hello from humanpc"
  - hotkey: [ctrl, s]
```

A bare list of steps (no top-level keys) is also valid:

```yaml
- open_app: notepad.exe
- type: "hi"
```

### Step forms

Every step is one of two shapes.

**Shorthand** — a single-key mapping `{verb: value}`. The value is interpreted
per-verb (see each verb below):

```yaml
- click: "Login"
- type: "hello"
- scroll: -3
```

**Verbose** — `{action: verb, ...params}`, used when a verb needs more than one
parameter (e.g. a right double-click, or a custom timeout):

```yaml
- action: click
  target: submit.png
  button: right
  clicks: 2

- action: wait_for
  target: "Dashboard"
  timeout: 30
  interval: 0.5
```

An optional `name:` key on any step is treated as a label and ignored by the
runner — handy for readability:

```yaml
- name: submit the form
  click: submit.png
```

---

## 2. Targets

Anything that locates something on screen (`click`, `move`, `find`, `wait_for`,
…) takes a **target**. The string form is auto-detected:

| You write            | Interpreted as | Found via |
|----------------------|----------------|-----------|
| `"Login"`            | text           | UI Accessibility (UIA) → OCR |
| `"button.png"`       | image          | OpenCV template match on screen |
| `"300,200"`          | point `(x, y)` | exact coordinates |
| `"10,20,60,24"`      | region `(x,y,w,h)` | clicks the region's centre |

Image extensions recognised: `.png .jpg .jpeg .bmp .gif .webp`. So this "click a
screenshot of a button" flow is exactly what the language is built for:

```yaml
steps:
  - wait_for: buttons/login.png     # waits until the picture appears
  - click: buttons/login.png        # human mouse path to it, then click
```

> **Image tips:** crop tight to the button; keep the same screen resolution /
> display-scaling / theme as when you captured it (mismatched DPI is the #1 cause
> of "can't find it"). Paths are relative to where you run `humanpc flow`.

---

## 3. Verb reference

All verbs available in a flow. "Shorthand value" is what a bare `verb: value`
maps to; use the **verbose** form for any other parameter.

### Mouse

| Verb | Shorthand value | Verbose params | Notes |
|------|-----------------|----------------|-------|
| `click` | `target` | `target`, `button` (`left`/`right`/`middle`, def. `left`), `clicks` (def. `1`) | Moves then clicks. |
| `double_click` | `target` | `target` | Two clicks. |
| `right_click` | `target` | `target` | |
| `move` / `move_to` | `target` | `target` | Move cursor, no click. |
| `scroll` | `amount` (int) | `amount` | + scrolls up, − scrolls down (per the input driver). |

```yaml
- click: "OK"
- action: click
  target: "File"
  button: right
- double_click: icon.png
- scroll: -5
```

### Keyboard

| Verb | Shorthand value | Notes |
|------|-----------------|-------|
| `type` | `text` | Human typing rhythm; injects then self-corrects typos so final text is exact. |
| `press` | one key or a list | Individual key presses. |
| `hotkey` | list, or `"ctrl+s"` | Chord: presses in order, releases in reverse. |

```yaml
- type: "hello@example.com"
- press: enter
- press: [tab, tab]
- hotkey: [ctrl, s]
- hotkey: "ctrl+shift+n"
```

Key names follow the active input driver (pyautogui-style): `ctrl alt shift win
enter tab esc space backspace delete up down left right home end pageup pagedown
f1`…`f12`, and single characters.

### Finding & screen

| Verb | Shorthand value | Verbose params | Returns in output |
|------|-----------------|----------------|-------------------|
| `find` | `target` | `target` | `{found, match}` |
| `find_all` | `target` | `target` | `{count, matches}` |
| `exists` | `target` | `target` | `{exists}` |
| `wait_for` | `target` | `target`, `timeout` (def. `10`), `interval` (def. `0.25`) | polls until it appears or raises |
| `screenshot` | `path` | `path` | saves PNG (or returns image if no path) |
| `read_text` | — | `region` (`x,y,w,h`) | OCR text of screen/region |

```yaml
- wait_for: "Dashboard"
- action: wait_for
  target: spinner_gone.png
  timeout: 45
- screenshot: proof.png
```

### Timing & deliberation

| Verb | Shorthand value | Verbose params | Notes |
|------|-----------------|----------------|-------|
| `think` | `complexity` (`low`/`medium`/`high`/`very_high`) | `complexity`, `choices` (int) | **Randomized** human hesitation. `choices` uses Hick–Hyman decision timing. |
| `sleep` | `seconds` (number) | `seconds` | **Fixed** pause. See note below. |

```yaml
- think: high            # variable, human-like pause
- sleep: 1.5             # exactly 1.5s every run
- action: think
  choices: 8             # "deciding among 8 options"
```

> ⚠️ **Random waits in YAML:** `sleep` is a fixed number and there is no
> range/random-sleep verb in the flow language today. For a random wait, either
> use `think` (already randomized) or drop into [Python](PYTHON_API.md)
> (`time.sleep(random.uniform(1, 3))`). If you want `sleep: [1, 3]` range syntax
> added to the flow language, it's a small change — ask and it can be added.

### System & windows

| Verb | Shorthand value | Verbose params | Notes |
|------|-----------------|----------------|-------|
| `run` | `command` | `command`, `cwd`, `timeout`, `shell` | Runs a shell command. |
| `open_app` | `target` | `target`, `args`, `wait` (window title), `timeout` (def. `15`) | Launches an app; `wait` blocks until its window appears. |
| `focus` | `title` | `title` | Bring a window to the foreground. |
| `windows` | — | — | List open windows. |

```yaml
- action: open_app
  target: notepad.exe
  wait: "Untitled - Notepad"
- run: "git status"
- focus: "Notepad"
```

---

## 4. Personas

A persona tunes speed and rhythm. Set it at the top of the flow or with
`--persona` on the CLI.

| Persona | Feel | Speed |
|---------|------|-------|
| `default` | balanced | 1.0× |
| `fast` | quick, confident | ~0.6× (faster) |
| `careful` | deliberate | ~1.5× (slower) |
| `tired` | sluggish, more pauses | ~1.8× (slowest) |

---

## 5. Safety

- **Kill-switch:** press **Ctrl+Alt+Q**, or slam the cursor into a screen corner,
  to abort any run (raises `Aborted`). The hotkey needs the `keyboard` package;
  the corner failsafe always works.
- **Dry-run:** `--dry-run` (or `dry_run: true`) plans and audits every step
  without touching the OS — the safest way to check a new flow.
- Every step is written to an **audit log**.

---

## 6. Generating flows by recording

You don't have to hand-write YAML. Record live and save it:

```python
from humanpc import Recorder, Bot

rec = Recorder(bot=Bot())                       # executes as you record
rec.click("Login").type("user").press("tab").type("pass").press("enter")
rec.save("login.yaml")                          # a normal flow file
```

Replay later with `humanpc flow login.yaml` or `Macro.load("login.yaml").replay()`.

---

## 7. What the flow language can't do

The flow language is **linear** — a fixed list of steps. It has **no** variables,
loops, conditionals, or random values. When you need those, use the Python API
(the flow runner is just a thin layer over it):

| You want… | Do it in Python |
|-----------|-----------------|
| Random wait | `time.sleep(random.uniform(1, 3))` |
| "click only if X is visible" | `if bot.exists("X"): bot.click("X")` |
| Repeat until done | `while bot.exists("Next"): bot.click("Next")` |
| Retry a flaky click | `bot.click_until("Save", until=lambda: bot.exists("Saved"))` |
| Read a value and branch | `if "error" in bot.read_text(): ...` |

See **[PYTHON_API.md](PYTHON_API.md)**.

---

## 8. Full example

```yaml
# notepad_note.yaml — open Notepad, write a dated note, save it.
persona: careful
steps:
  - name: launch
    action: open_app
    target: notepad.exe
    wait: "Untitled - Notepad"

  - think: low
  - type: "Meeting notes\n-------------\n"
  - type: "Action items go here."

  - name: save
    hotkey: [ctrl, s]
  - wait_for: "Save As"
  - type: "notes.txt"
  - press: enter
```

```bash
humanpc --dry-run flow notepad_note.yaml   # rehearse
humanpc flow notepad_note.yaml             # run
```

</script>
<script type="text/markdown" data-id="python-api" data-title="Python API" data-file="PYTHON_API.md">
# humanpc Python API Reference

humanpc **is** a Python library. `from humanpc import Bot` gives you the whole
engine — the same one behind the [flow language](FLOW_LANGUAGE.md) and the CLI —
but now inside real Python, so you get **random waits, loops, conditionals, and
variables** for free.

```python
from humanpc import Bot

bot = Bot()                               # real input (lazy-loads the driver)
bot.move_to("Sign in").click()            # text target → human mouse path
bot.type("me@example.com")                # human typing, self-correcting typos
bot.click(Image("submit.png"))            # image target → template match
bot.wait_for("Dashboard", timeout=20)
```

Every action funnels through the same safety pre-check (kill-switch, action cap)
and audit trail, so those apply no matter how you call it.

---

## 1. Install

```bash
pip install -e ".[all,flows]"     # everything: input, capture, vision (images), OCR, UIA, windows
pip install -e .                  # core only — dry-run + tests, zero dependencies
```

Extras are opt-in: `input` (real mouse/keys), `capture` + `vision` (screenshots +
image matching), `ocr` (read text), `uia` (accessibility targeting), `windows`
(window/app management), `flows` (YAML), `server` (HTTP/MCP).

---

## 2. Creating a Bot

```python
Bot(
    persona="default",     # "default" | "fast" | "careful" | "tired"
    *,
    dry_run=False,         # True → plan + audit, never touch the OS
    config=None,           # a Config(...) for finer control (seed, safety, timing)
    idle=False,            # True → subtle background cursor drift while idle
    arm=True,              # True → arm the kill-switch + precision timer now
    # advanced injection seams: driver, audit, killswitch, resolver, windows, clipboard, profile
)
```

Common patterns:

```python
bot = Bot("fast")                             # quick persona
bot = Bot(dry_run=True)                        # rehearse safely
bot = Bot(config=Config(seed=42))              # reproducible run (same "person" each time)

with Bot() as bot:                             # context manager → auto-cleanup
    bot.click("OK")
```

Each Bot samples a stable **individual** — its own consistent speed/rhythm
"fingerprint." Same `seed` → same person every run; no seed → a new person each run.

### Config options

```python
from humanpc import Config
Config(
    persona="default",
    dry_run=False,
    failsafe=True,               # slam-cursor-to-corner abort
    kill_hotkey="ctrl+alt+q",    # global panic hotkey (None to disable)
    max_actions=None,            # hard cap on actions per Bot (None = unlimited)
    audit_enabled=True,
    audit_path=None,             # JSONL file, or None for in-memory
    typing_errors=True,          # inject realistic typos...
    always_correct_typing=True,  # ...but always fix them → final text exact
    precision_timing=True,       # high-resolution sleeps (Windows 1ms timer)
    relative_mouse=False,        # relative deltas through pointer ballistics vs absolute
    individuality=True,          # sample a per-Bot behavioural profile
    seed=None,                   # deterministic RNG
)
```

---

## 3. Targets

Every locating method accepts the same target types:

```python
bot.click("Login")               # str  → text (UIA → OCR)
bot.click((400, 300))            # (x, y) → point
bot.click((10, 20, 60, 24))      # (x, y, w, h) → region centre
bot.click(Image("submit.png"))   # Image → template match
```

`Image` is tunable:

```python
from humanpc import Image
Image(
    "submit.png",
    confidence=0.8,          # 0–1 match threshold (default 0.8)
    grayscale=True,          # faster, scale-robust
    scales=(0.9, 1.0, 1.1),  # try multiple sizes (handles minor DPI drift)
    region=None,             # a Rect to search only part of the screen
)
```

---

## 4. Methods

Most action methods **return `self`**, so you can chain:
`bot.move_to("File").click().type("x")`.

### Mouse

| Method | Signature | Notes |
|--------|-----------|-------|
| `move_to` | `move_to(target, *, target_size=None)` | Human curved path; small targets get a slower, careful approach. |
| `click` | `click(target=None, *, button="left", clicks=1)` | `target=None` clicks where the cursor is. |
| `double_click` | `double_click(target=None, *, button="left")` | |
| `right_click` | `right_click(target=None)` | |
| `drag` | `drag(to, *, frm=None, button="left")` | Press at `frm` (or current), move to `to`, release. |
| `scroll` | `scroll(amount, *, at=None)` | `at` moves there first. + up / − down. |

### Keyboard

| Method | Signature | Notes |
|--------|-----------|-------|
| `type` | `type(text)` | Human rhythm; typos injected then self-corrected. `\n` = enter. |
| `press` | `press(*keys)` | e.g. `bot.press("enter")`, `bot.press("tab", "tab")`. |
| `hotkey` | `hotkey(*keys)` | Chord, e.g. `bot.hotkey("ctrl", "s")`. |

### Deliberation (humanized, randomized pauses)

| Method | Signature | Notes |
|--------|-----------|-------|
| `think` | `think(complexity="medium", *, choices=None)` | Pause as if deciding. `complexity`: `low`/`medium`/`high`/`very_high`. `choices=N` → Hick–Hyman decision time. |
| `read`  | `read(content, *, complexity=1.0, scan=False)` | Pause as if reading; `content` = text or char count; `scan=True` skims. |

### Finding & screen

| Method | Signature | Returns |
|--------|-----------|---------|
| `find` | `find(target)` | `Match` or `None` |
| `find_all` | `find_all(target)` | `list[Match]` |
| `exists` | `exists(target)` | `bool` |
| `wait_for` | `wait_for(target, *, timeout=10.0, interval=0.25)` | `Match` (raises `TargetNotFound` on timeout) |
| `screenshot` | `screenshot(path=None, *, region=None)` | saves to `path`, else returns a PIL image |
| `read_text` | `read_text(*, region=None)` | OCR'd `str` |
| `position` | `position()` | current cursor `(x, y)` |

A `Match` has `.center` (Point), `.size`, `.bbox` (Rect), `.confidence`, `.method`
(`coords`/`region`/`uia`/`ocr`/`template`), `.text`.

### Verification (confirm an action landed)

| Method | Signature | Notes |
|--------|-----------|-------|
| `verify` | `verify(check, *, attempts=3, interval=0.25, retry=None)` | Poll `check()` until truthy → `bool`. |
| `ensure` | `ensure(check, *, attempts=3, interval=0.25, retry=None, message=None)` | Like `verify` but raises `VerificationError`. |
| `click_until` | `click_until(target, until, *, attempts=3, interval=0.3, button="left")` | Click and re-click until `until()` holds. |

### Windows & system

| Method | Signature | Notes |
|--------|-----------|-------|
| `open_app` | `open_app(target, args=(), *, wait=None, timeout=15.0)` | `wait` = window title to block on. |
| `focus` | `focus(target)` | Bring a window (title or `Window`) to front. |
| `list_windows` / `find_window` / `active_window` | | Enumerate / locate windows. |
| `wait_for_window` | `wait_for_window(title, *, timeout=15.0, interval=0.3)` | |
| `run` | `run(command, **kwargs)` | Shell command → `ShellResult(ok, returncode, stdout, stderr)`. |

### Idle & lifecycle

| Method | Notes |
|--------|-------|
| `start_idle()` / `stop_idle()` | Background micro cursor-drift, like a resting hand. |
| `persona(name)` | Context manager: `with bot.persona("careful"): ...`. |
| `close()` | Release kill-switch, timer, idle loop (or use `with Bot() as bot:`). |

---

## 5. Dynamic behavior — the reason to use Python

This is what the flow YAML can't do.

### Random waits

```python
import random, time

time.sleep(random.uniform(1.0, 3.0))      # plain random wait, 1–3s

# Even better — a *humanized* pause that's already randomized for you:
bot.think("high")                          # hesitate like a person deciding
bot.read("a paragraph of on-screen text")  # pause proportional to reading it
```

A tiny reusable helper:

```python
def wait_random(lo, hi):
    time.sleep(random.uniform(lo, hi))

bot.click("Login")
wait_random(0.8, 2.5)
bot.type("hunter2")
```

### Conditionals

```python
if bot.exists("Accept Cookies"):
    bot.click("Accept Cookies")

if "error" in bot.read_text().lower():
    bot.screenshot("error.png")
```

### Loops

```python
# Keep clicking "Next" until it's gone.
while bot.exists("Next"):
    bot.click("Next")
    bot.think("low")

# Process every matching icon on screen.
for m in bot.find_all(Image("row_checkbox.png")):
    bot.click(m.center)

# Retry a flaky click until the UI confirms it worked.
bot.click_until("Save", until=lambda: bot.exists("Saved"))
```

### Reproducible vs. varied runs

```python
Bot(config=Config(seed=1))   # identical timing/typos every run — great for tests
Bot()                        # a different "person" each run — natural variety
```

---

## 6. Personas

Switch persona per-Bot or temporarily:

```python
bot = Bot("careful")

with bot.persona("fast"):     # this block runs quick...
    bot.type("quick note")
# ...back to careful here
```

`default` (1.0×) · `fast` (~0.6×) · `careful` (~1.5×) · `tired` (~1.8×).

---

## 7. Safety

```python
bot = Bot(config=Config(max_actions=200))   # hard stop after 200 actions
```

- **Ctrl+Alt+Q** or cursor-to-corner aborts mid-run → raises `Aborted`.
- `Bot(dry_run=True)` plans + audits with zero OS side-effects; inspect
  `bot.audit.entries` afterward.

---

## 8. Module-level shortcuts

For throwaway scripts, call verbs directly on a shared singleton Bot:

```python
import humanpc as h
h.click((100, 200)); h.type("hi"); h.hotkey("ctrl", "s")
```

---

## 9. Record & replay

```python
from humanpc import Recorder, Bot, Macro

rec = Recorder(bot=Bot())                    # runs live as you record
rec.click("Login").type("user").press("enter")
rec.save("login.yaml")                        # a normal flow file

Macro.load("login.yaml").replay(bot=Bot())    # replay later
```

---

## 10. Exceptions

All inherit `HumanpcError`:

| Exception | Raised when |
|-----------|-------------|
| `TargetNotFound` | The resolver can't locate a target (or `wait_for` times out). |
| `Aborted` | Kill-switch fired or a safety limit was hit mid-action. |
| `DriverError` | An input/screen/optional backend is missing or failed. |
| `VerificationError` | `ensure` / `click_until` couldn't confirm the result. |

```python
from humanpc import Bot, TargetNotFound

bot = Bot()
try:
    bot.click("Submit")
except TargetNotFound:
    bot.screenshot("missing.png")
```

---

## 11. Full example

```python
import random, time
from humanpc import Bot, Image, TargetNotFound

def wait_random(lo, hi):
    time.sleep(random.uniform(lo, hi))

with Bot("careful") as bot:
    bot.open_app("notepad.exe", wait="Untitled - Notepad")
    bot.think("low")

    for line in ("Meeting notes", "-------------", "Action items:"):
        bot.type(line + "\n")
        wait_random(0.3, 1.0)          # human pause between lines

    # Save, retrying until the Save-As dialog actually appears.
    bot.hotkey("ctrl", "s")
    try:
        bot.wait_for("Save As", timeout=10)
        bot.type("notes.txt")
        bot.press("enter")
    except TargetNotFound:
        bot.screenshot("save_failed.png")
```

See also: **[FLOW_LANGUAGE.md](FLOW_LANGUAGE.md)** for the declarative YAML format.

# Changelog

All notable changes to **humanpc**. The framework was built in phases; each phase
was committed directly to `main` (see [`docs/BUILD_PHASES.md`](docs/BUILD_PHASES.md)).

## [Unreleased]

### Provenance & timing (Tier 0 — see [`GAP_ANALYSIS.md`](GAP_ANALYSIS.md))
- **Keystroke dwell:** typed characters now go through `char_down → hold → char_up`
  with a realistic, right-skewed key-hold time (`hil/typing/DwellModel`) instead of
  an atomic zero-dwell emit. `InputDriver` gains `char_down`/`char_up` (default
  falls back to `write_char`); `SendInputDriver` implements true split injection.
- **High-resolution timing:** `precise_sleep` (coarse sleep + sub-tick busy-wait)
  plus 1 ms Windows timer tick (`hil/precise`), so sub-frame delays are realised
  instead of quantising to the ~15.6 ms scheduler tick. Toggle: `Config.precision_timing`.
- **Relative mouse motion (opt-in):** `Config.relative_mouse` injects relative deltas
  through the OS pointer-acceleration curve, then iteratively corrects residual drift
  to land exactly on target (with an absolute snap for the final sub-pixel that
  "Enhance pointer precision" cannot express relatively). New
  `InputDriver.move_relative` primitive. *(Validated on Windows 11.)*
- **Injected-flag honesty:** `SendInputDriver(extra_info=...)` tags `dwExtraInfo`.
  Documented clearly that user-mode `SendInput` **cannot** remove the
  `LLKHF_INJECTED` flag — that requires a kernel/hardware HID backend, which plugs
  into the existing `Bot(driver=...)` seam.
- `Bot` is now a context manager (`with Bot() as bot: ...`) / has `close()` to
  release the timer tick, idle drift, and kill-switch.

## [0.1.0] — 2026-06-11

First feature-complete release: Phases 0–5. 146 tests; `import humanpc` loads zero
heavy dependencies (every backend is lazy). Validated on a real Windows 11 desktop.

### Phase 0 — Skeleton & safety
- Sync `Bot` facade; pluggable `InputDriver` + dependency-free `NullDriver`
- Kill-switch, `SafetyGuard` (`max_actions`), append-only `AuditLog`
- Per-monitor DPI awareness; `mss` screen capture; config + personas

### Phase 1 — Human Interaction Layer
- Mouse: Bézier path + Fitts-law velocity + jitter + overshoot
- Typing: variable speed, pauses, and self-correcting typos (final text exact)
- Burst scroll; timing manager (`Bot.think` / `Bot.read`)

### Phase 2 — Targeting resolver
- `resolve(target) -> Match`: text → UIA → OCR, image → OpenCV template, coords
- `Bot.find` / `exists` / `wait_for`; match size feeds the Fitts model

### Phase 3 — Window & system tools
- `WindowManager` / `Window`; shell `run`; app launch/kill; clipboard
- `find_all` across template / OCR / UIA

### Phase 4 — Calling interfaces
- One shared dispatcher (`execute(bot, action, params)`)
- CLI (`humanpc <verb>`), FastAPI HTTP server, MCP tool server, YAML/JSON flows

### Phase 5 — Polish
- Idle mouse drift (`Bot(idle=True)` / `start_idle`)
- Record/replay macros (`Recorder` → `Macro`)
- Behavioral state machine (`bot.behavior` / `bot.state`)
- Native Win32 `SendInputDriver` (games backend)
- Browser (Playwright/CDP) backend — deferred
